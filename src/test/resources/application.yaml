# Test profile — no Keycloak/Redis/backends required to load the context.
gateway:
  security:
    oauth2:
      enabled: false
  rate-limiter:
    enabled: false

spring:
  ai:
    mcp:
      client:
        enabled: false

management:
  tracing:
    sampling:
      probability: 0.0

---
spring:
  config:
    activate:
      on-profile: test

  ai:
    openai:
      api-key: test-key
      chat:
        model: gpt-4o-mini
logging:
  level:
    root: WARN
    com.org: DEBUG

app:
  security:
    injection-guard:
      enabled: true
management:
  tracing:
    export:
      enabled: false
